<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>皇帝氷鳥 親睦パズルソルバー</title><style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--mut:#8b949e;--ice:#58a6ff;--gold:#d6b55d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:16px}.head{padding:12px 0 18px;border-bottom:1px solid var(--line)}.brand{font-size:11px;letter-spacing:.18em;color:#8bdcff}.head h1{font-size:24px;margin:5px 0}.head p,.note{font-size:12px;color:var(--mut);line-height:1.55}.section{padding:18px 0;border-bottom:1px solid var(--line)}h2{font-size:17px;margin:0 0 12px}.drop{display:block;border:1px dashed #58a6ff;background:var(--card);padding:24px;text-align:center;border-radius:8px;cursor:pointer}.drop input{display:none}#preview{position:relative;margin-top:10px}#preview img{display:block;width:100%;max-height:350px;object-fit:contain;border-radius:7px;border:1px solid var(--line)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}button,select,input{font:inherit}button{touch-action:manipulation;border:1px solid var(--line);background:#21262d;color:var(--txt);padding:9px 12px;border-radius:6px;font-weight:600}.primary{background:#238636;border-color:#2ea043}.ice{border-color:#58a6ff}.danger{color:#ff7b72}.board,.answer{display:grid;grid-template-columns:repeat(5,52px);gap:5px;justify-content:center;margin:12px 0}.cell,.acell{width:52px;height:52px;border-radius:5px}.cell{padding:0;background:#f0f6fc;border:1px solid #8c959f}.cell.off{background:#161b22;border:1px dashed #30363d}.count{text-align:center;color:var(--mut);font-size:12px}.req{display:grid;grid-template-columns:1fr 1fr 64px 40px;gap:7px;margin:7px 0}.req select,.req input{width:100%;min-width:0;background:#0d1117;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:8px}.pieceTools{display:flex;justify-content:space-between;gap:8px;align-items:center}.pieceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.piece{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:11px}.mini{display:grid;grid-template-columns:repeat(3,7px);grid-template-rows:repeat(3,7px);gap:1px;flex:none}.m{background:transparent}.m.on{background:#d9f4ff}.badge{font-weight:800}.solve{width:100%;padding:13px;font-size:16px}.status{margin-top:9px;font-size:12px;color:var(--mut)}.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;font-size:12px;padding:9px 5px}.tabs .selected{border-color:var(--ice);color:#8bdcff}.acell{display:grid;place-items:center;text-align:center;font-size:10px;font-weight:800;border:1px solid #ffffff44}.x{background:#161b22;color:#484f58;border-style:dashed}.red{background:#b62324}.blue{background:#1f6feb}.yellow{background:#d29922;color:#111}.purple{background:#8250df}.detail{padding:10px;border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:12px;line-height:1.6}.rankA{color:#ffd76a}.rankB{color:#c5d1dd}.rankC{color:#d9a87e}@media(max-width:390px){.board,.answer{grid-template-columns:repeat(5,47px)}.cell,.acell{width:47px;height:47px}.pieceGrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><header class="head"><div class="brand">KOUTEI HYOUCHOU UTILITY</div><h1>皇帝氷鳥 親睦パズルソルバー</h1><p>スクショ認識・手動修正・条件設定・45ピース選択・3方針探索。回転／反転なし。</p></header>
<section class="section"><h2>1. 問題スクショ</h2><label id="drop" class="drop">クリックして画像を選択<br><span class="note">またはドラッグ＆ドロップ／画像をコピーして貼り付け</span><input id="file" type="file" accept="image/*"></label><div id="preview"></div><div class="row"><label>盤面マス数 <select id="target"><option>16</option><option>20</option><option>24</option><option>25</option></select></label><button class="ice" id="recognize">再認識</button><button id="loadProblem">今回の問題を読込</button></div><h3 style="font-size:14px">認識された盤面</h3><p class="note">白いマスが埋める場所です。誤認識したマスはタップでON/OFFできます。</p><div class="row"><button id="clearBoard">全消去</button><button id="fillBoard">全選択</button></div><div id="board" class="board"></div><div id="count" class="count">0マス</div></section>
<section class="section"><h2>2. 条件設定</h2><div id="reqs"></div><div class="row"><button id="addReq">＋ 条件を追加</button><button id="clearReq">条件を全削除</button></div><p class="note">例：「赤 B以上」は赤色かつAまたはBのピースが対象。数量は使用するピース数で数えます。</p><div class="pieceTools"><b>使用できるピースを個別に変更</b><span class="note"><span id="enabledCount">45</span>/45</span></div><div class="row"><button id="allPieces">全て有効</button><button id="noPieces">全て無効</button></div><div id="pieceGrid" class="pieceGrid"></div></section>
<section class="section"><button id="solve" class="primary solve">解答を探す</button><div id="status" class="status">盤面を設定してください</div></section>
<section class="section"><h2>3. 解答</h2><div id="tabs" class="tabs"></div><div id="result"><p class="note">解答を探すと、C優先・B優先・A優先の3候補を表示します。</p></div></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),COL=['赤','青','黄','紫'],RV={C:1,B:2,A:3},CC={'赤':'red','青':'blue','黄':'yellow','紫':'purple'};const K=(x,y)=>x+','+y;
const SH={T0:[[0,0],[1,0],[2,0],[1,1]],T1:[[0,0],[0,1],[1,1],[0,2]],T2:[[1,0],[0,1],[1,1],[2,1]],T3:[[1,0],[0,1],[1,1],[1,2]],L0:[[0,0],[0,1],[0,2],[1,2]],L1:[[0,0],[1,0],[2,0],[0,1]],L2:[[0,0],[1,0],[1,1],[1,2]],L3:[[2,0],[0,1],[1,1],[2,1]],J0:[[1,0],[1,1],[0,2],[1,2]],J1:[[0,0],[0,1],[1,1],[2,1]],J2:[[0,0],[1,0],[0,1],[0,2]],J3:[[0,0],[1,0],[2,0],[2,1]],S0:[[1,0],[2,0],[0,1],[1,1]],S1:[[0,0],[0,1],[1,1],[1,2]],Z0:[[0,0],[1,0],[1,1],[2,1]],Z1:[[1,0],[0,1],[1,1],[0,2]],O:[[0,0],[1,0],[0,1],[1,1]],I0:[[0,0],[1,0],[2,0],[3,0]],I1:[[0,0],[0,1],[0,2],[0,3]]};
// 48 fixed-orientation pieces: A/B/C each have 4 orientations × 4 colors. User can enable/disable each independently.
const specs=[];let id=0;function P(color,rank,shape,label){specs.push({id:id++,color,rank,shape,label,enabled:true})}
// Fixed-orientation pieces. No runtime rotation/reflection.
// Verified from in-game inventory screenshots. A=L tetromino, B=zig-zag tetromino, C=T tetromino. Each color has four fixed orientations. No rotation/reflection at placement time.
COL.forEach(c=>['L0','L1','L2','L3'].forEach((s,j)=>P(c,'A',s,'A'+(j+1))));
COL.forEach(c=>['S1','S0','Z1','Z0'].forEach((s,j)=>P(c,'B',s,'B'+(j+1))));
COL.forEach(c=>['T0','T1','T2','T3'].forEach((s,j)=>P(c,'C',s,'C'+(j+1))));
let active=new Set(),reqs=[],solutions=[],imageData=null;
function renderBoard(){let h='';for(let y=0;y<5;y++)for(let x=0;x<5;x++){let on=active.has(K(x,y));h+=`<button class="cell ${on?'':'off'}" data-x="${x}" data-y="${y}" aria-label="${x},${y}"></button>`}$('board').innerHTML=h;$('count').textContent=active.size+'マス'}
$('board').onclick=e=>{let b=e.target.closest('.cell');if(!b)return;let k=K(+b.dataset.x,+b.dataset.y);active.has(k)?active.delete(k):active.add(k);renderBoard()};$('clearBoard').onclick=()=>{active.clear();renderBoard()};$('fillBoard').onclick=()=>{active=new Set();for(let y=0;y<5;y++)for(let x=0;x<5;x++)active.add(K(x,y));renderBoard()};
function renderReq(){ $('reqs').innerHTML=reqs.map((r,i)=>`<div class="req"><select data-i="${i}" data-f="color">${COL.map(c=>`<option ${c===r.color?'selected':''}>${c}</option>`)}</select><select data-i="${i}" data-f="rank">${['A','B','C'].map(v=>`<option ${v===r.rank?'selected':''}>${v}</option>`)}</select><input data-i="${i}" data-f="count" type="number" min="1" max="9" value="${r.count}"><button data-del="${i}" class="danger">×</button></div>`).join('')}
$('reqs').onchange=e=>{let i=+e.target.dataset.i,f=e.target.dataset.f;if(f)reqs[i][f]=f==='count'?+e.target.value:e.target.value};$('reqs').onclick=e=>{if(e.target.dataset.del!==undefined){reqs.splice(+e.target.dataset.del,1);renderReq()}};$('addReq').onclick=()=>{reqs.push({color:'赤',rank:'B',count:1});renderReq()};$('clearReq').onclick=()=>{reqs=[];renderReq()};
function mini(shape){let pts=SH[shape],set=new Set(pts.map(p=>K(...p))),h='';for(let y=0;y<3;y++)for(let x=0;x<3;x++)h+=`<i class="m ${set.has(K(x,y))?'on':''}"></i>`;return h}function renderPieces(){$('pieceGrid').innerHTML=specs.map(p=>`<label class="piece"><input type="checkbox" data-p="${p.id}" ${p.enabled?'checked':''}><span class="mini">${mini(p.shape)}</span><span><span class="badge rank${p.rank}">${p.color}${p.rank}</span><br>${p.label}</span></label>`).join('');$('enabledCount').textContent=specs.filter(p=>p.enabled).length}$('pieceGrid').onchange=e=>{if(e.target.dataset.p!==undefined){specs[+e.target.dataset.p].enabled=e.target.checked;$('enabledCount').textContent=specs.filter(p=>p.enabled).length}};$('allPieces').onclick=()=>{specs.forEach(p=>p.enabled=true);renderPieces()};$('noPieces').onclick=()=>{specs.forEach(p=>p.enabled=false);renderPieces()};
function setImage(file){if(!file||!file.type.startsWith('image/'))return;let r=new FileReader();r.onload=ev=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),max=1000,sc=Math.min(1,max/img.width);c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);let ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);imageData={canvas:c,ctx};$('preview').innerHTML='';$('preview').appendChild(c);c.style.width='100%';c.style.maxHeight='350px';c.style.objectFit='contain';c.style.border='1px solid #30363d';c.style.borderRadius='7px';recognize()};img.src=ev.target.result};r.readAsDataURL(file)}
$('file').onchange=e=>setImage(e.target.files[0]);['dragenter','dragover'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault()}));$('drop').ondrop=e=>{e.preventDefault();setImage(e.dataTransfer.files[0])};document.addEventListener('paste',e=>{for(let it of e.clipboardData.items)if(it.type.startsWith('image/')){setImage(it.getAsFile());break}});
function recognize(){
if(!imageData){$('status').textContent='先にスクショを読み込んでください。';return}
let {canvas:c,ctx}=imageData,w=c.width,h=c.height,im=ctx.getImageData(0,0,w,h).data;
// 明るく彩度の低い「白い盤面マス」を連結成分として検出する。
// 縦長・横長どちらのゲームスクショでも、固定座標には依存しない。
let step=2,sw=Math.ceil(w/step),sh=Math.ceil(h/step),bin=new Uint8Array(sw*sh);
for(let yy=0;yy<sh;yy++)for(let xx=0;xx<sw;xx++){
 let x=Math.min(w-1,xx*step),y=Math.min(h-1,yy*step),q=(y*w+x)*4;
 let r=im[q],g=im[q+1],b=im[q+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),v=(r+g+b)/3;
 if(v>145 && mx-mn<78)bin[yy*sw+xx]=1;
}
let seen=new Uint8Array(sw*sh), comps=[], stack=[];
for(let yy=1;yy<sh-1;yy++)for(let xx=1;xx<sw-1;xx++){
 let seed=yy*sw+xx;if(!bin[seed]||seen[seed])continue;
 seen[seed]=1;stack.length=0;stack.push(seed);let n=0,minx=xx,maxx=xx,miny=yy,maxy=yy,sx=0,sy=0;
 while(stack.length){let z=stack.pop(),zy=Math.floor(z/sw),zx=z-zy*sw;n++;sx+=zx;sy+=zy;if(zx<minx)minx=zx;if(zx>maxx)maxx=zx;if(zy<miny)miny=zy;if(zy>maxy)maxy=zy;
  let ns=[z-1,z+1,z-sw,z+sw];for(let k of ns)if(k>=0&&k<bin.length&&bin[k]&&!seen[k]){seen[k]=1;stack.push(k)}
 }
 let bw=(maxx-minx+1)*step,bh=(maxy-miny+1)*step,area=n*step*step,ratio=bw/bh;
 if(area>w*h*.002 && area<w*h*.04 && ratio>.65&&ratio<1.45 && bw>w*.035&&bh>h*.035&&bw<w*.25&&bh<h*.25)comps.push({x:(sx/n)*step,y:(sy/n)*step,bw,bh,area});
}
// 同程度サイズの正方形群を優先（UIの白文字等の誤検出を除外）
if(comps.length){let sizes=comps.map(o=>(o.bw+o.bh)/2).sort((a,b)=>a-b),med=sizes[Math.floor(sizes.length/2)];comps=comps.filter(o=>{let z=(o.bw+o.bh)/2;return z>med*.68&&z<med*1.45})}
function clusters(vals,tol){let a=[...vals].sort((a,b)=>a-b),out=[];for(let v of a){let g=out.find(q=>Math.abs(q.mean-v)<tol);if(g){g.v.push(v);g.mean=g.v.reduce((x,y)=>x+y,0)/g.v.length}else out.push({mean:v,v:[v]})}return out.sort((a,b)=>a.mean-b.mean)}
if(comps.length>=4){let medW=comps.map(o=>o.bw).sort((a,b)=>a-b)[Math.floor(comps.length/2)],xs=clusters(comps.map(o=>o.x),medW*.55),ys=clusters(comps.map(o=>o.y),medW*.55);
 // 最大5列・5行になるよう、盤面らしい範囲を採用
 if(xs.length<=6&&ys.length<=6){active=new Set();for(let o of comps){let gx=xs.reduce((best,g,i)=>Math.abs(g.mean-o.x)<Math.abs(xs[best].mean-o.x)?i:best,0),gy=ys.reduce((best,g,i)=>Math.abs(g.mean-o.y)<Math.abs(ys[best].mean-o.y)?i:best,0);if(gx<5&&gy<5)active.add(K(gx,gy))}
  if([16,20,24,25].includes(active.size))$('target').value=String(active.size);renderBoard();$('status').textContent=`${active.size}マスを自動認識しました。違うマスだけタップで修正してください。`;return}
 }
$('status').textContent='自動認識できませんでした。盤面をタップして設定してください。';
}$('recognize').onclick=recognize;$('loadProblem').onclick=recognize;
function placements(p){let pts=SH[p.shape],mx=Math.max(...pts.map(q=>q[0])),my=Math.max(...pts.map(q=>q[1])),out=[];for(let y=0;y<5-my;y++)for(let x=0;x<5-mx;x++){let cells=pts.map(q=>K(x+q[0],y+q[1]));if(cells.every(z=>active.has(z)))out.push(cells)}return out}function reqOK(u){return reqs.every(r=>u.filter(p=>p.color===r.color&&RV[p.rank]>=RV[r.rank]).length>=r.count)}
function search(order){let ps=specs.filter(p=>p.enabled).map(p=>({...p,pl:placements(p)})).filter(p=>p.pl.length);ps.sort((a,b)=>order.indexOf(a.rank)-order.indexOf(b.rank));let by={};active.forEach(c=>by[c]=[]);ps.forEach((p,i)=>p.pl.forEach((cells,j)=>cells.forEach(c=>by[c].push([i,j]))));let occ=new Set(),usedIds=new Set(),used=[],ans=null,nodes=0;function dfs(){if(++nodes>500000)return false;if(occ.size===active.size){if(reqOK(used)){ans=used.map(x=>({...x}));return true}return false}let opts=null;for(let c of active){if(occ.has(c))continue;let o=(by[c]||[]).filter(([i,j])=>!usedIds.has(ps[i].id)&&ps[i].pl[j].every(z=>!occ.has(z)));if(opts===null||o.length<opts.length){opts=o;if(!o.length)break}}if(!opts||!opts.length)return false;for(let [i,j] of opts){let p=ps[i],cells=p.pl[j];cells.forEach(z=>occ.add(z));usedIds.add(p.id);used.push({...p,cells});if(dfs())return true;used.pop();usedIds.delete(p.id);cells.forEach(z=>occ.delete(z))}return false}dfs();return {ans,nodes}}
$('solve').onclick=()=>{if(!active.size){$('status').textContent='盤面を設定してください';return}$('status').textContent='探索中…';setTimeout(()=>{let modes=[['C優先',['C','B','A']],['B優先',['B','C','A']],['A優先',['A','B','C']]];solutions=modes.map(([name,o])=>({name,...search(o)}));let ok=solutions.filter(s=>s.ans);$('status').textContent=ok.length?ok.length+'候補見つかりました':'現在の条件では解が見つかりませんでした';$('tabs').innerHTML=solutions.map((s,i)=>`<button data-s="${i}" class="${i===0?'selected':''}">${s.name}</button>`).join('');show(Math.max(0,solutions.findIndex(s=>s.ans)))},30)};$('tabs').onclick=e=>{let b=e.target.closest('button');if(!b)return;document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');show(+b.dataset.s)};
function show(i){let s=solutions[i];if(!s||!s.ans){$('result').innerHTML='<div class="detail">この方針では解なし</div>';return}let map={};s.ans.forEach((p,n)=>p.cells.forEach(c=>map[c]={...p,n:n+1}));let h='<div class="answer">';for(let y=0;y<5;y++)for(let x=0;x<5;x++){let k=K(x,y);if(!active.has(k))h+='<div class="acell x">×</div>';else{let p=map[k];h+=`<div class="acell ${CC[p.color]}">${p.n}<br>${p.color}${p.rank}</div>`}}h+='</div><div class="detail"><b>'+s.name+'</b><br>'+s.ans.map((p,n)=>`${n+1}. ${p.color}${p.rank} ${p.label}`).join('<br>')+'</div>';$('result').innerHTML=h}
renderBoard();renderReq();renderPieces();})();
</script></body></html>
